<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark base so Google's circular/rounded mask has zero white bleed -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle inner architectural frame -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" />

  <!-- Geometric "K" Monogram (Pure Vector Paths, Zero Font Dependency) -->
  <!-- Vertical Pillar -->
  <rect x="132" y="128" width="66" height="256" rx="14" fill="url(#kGrad)" />
  <!-- Upper Arm & Lower Leg -->
  <path d="M 212 248 L 304 138 C 312 130 322 128 334 128 L 366 128 C 378 128 384 142 375 152 L 274 260 L 380 360 C 389 369 383 384 370 384 L 330 384 C 318 384 308 379 300 370 L 212 268 Z" fill="url(#kGrad)" />

  <!-- Signature Emerald Status Node (Clean separation in top-right quadrant) -->
  <circle cx="408" cy="104" r="38" fill="#10b981" fill-opacity="0.22" />
  <circle cx="408" cy="104" r="20" fill="#10b981" />
</svg>